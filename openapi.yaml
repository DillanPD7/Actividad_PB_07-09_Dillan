openapi: 3.2.0
info:
  title: API de pedidos
  version: 1.0.0
  description: API de checkout transaccional con inventario y pedidos.
servers:
  - url: http://localhost:3000
    description: Servidor local
paths:
  /api/pedidos:
    post:
      summary: Procesar el checkout de un pedido
      operationId: crearPedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
            example:
              usuarioId: 1
              productosComprados:
                - productoId: 12
                  cantidad: 2
                - productoId: 18
                  cantidad: 1
      responses:
        '201':
          description: Pedido procesado, inventario actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          description: Datos incompletos, usuario o producto inexistente, o stock insuficiente. La transacción se revierte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: El total excede el límite permitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error inesperado del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    CheckoutRequest:
      type: object
      required:
        - usuarioId
        - productosComprados
      properties:
        usuarioId:
          type: integer
          minimum: 1
          example: 1
        productosComprados:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProductoComprado'
    ProductoComprado:
      type: object
      required:
        - productoId
        - cantidad
      properties:
        productoId:
          type: integer
          minimum: 1
          example: 12
        cantidad:
          type: integer
          minimum: 1
          example: 2
    Pedido:
      type: object
      properties:
        id:
          type: integer
        usuarioId:
          type: integer
        total:
          type: string
          example: '49.98'
        estado:
          type: string
          example: completado
        usuario:
          type: object
          properties:
            id:
              type: integer
            nombre:
              type: string
            email:
              type: string
              format: email
        detalles:
          type: array
          items:
            type: object
            properties:
              productoId:
                type: integer
              cantidad:
                type: integer
              precioUnitario:
                type: string
                example: '24.99'
              subtotal:
                type: string
                example: '49.98'
              producto:
                type: object
                properties:
                  id:
                    type: integer
                  nombre:
                    type: string
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
            - code
          properties:
            message:
              type: string
            code:
              type: string
